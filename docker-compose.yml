version: '3.8'

services:
  taniworks-website:
    image: gudianjun/taniworks-website:latest
    container_name: taniworks-website
    restart: unless-stopped
    ports:
      - "80:80"
      # 如果需要 HTTPS，可以使用:
      # - "443:443"
    environment:
      - TZ=Asia/Tokyo
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    labels:
      - "com.taniworks.description=TaniWorks Corporate Website"
      - "com.taniworks.version=1.0"
    networks:
      - taniworks-network

networks:
  taniworks-network:
    driver: bridge
